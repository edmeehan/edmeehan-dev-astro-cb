links:
  type: array
  comment: "Array of navigation links to display in the footer."
  options:
    structures: _structures.linkItems
socials:
  type: array
  comment: "Array of social media links to display in the footer."
  options:
    structures: _structures.socialItems
footerText:
  type: text
  comment: "Legal text or copyright information to display at the bottom of the footer."
_structures:
  linkItems:
    values:
      - label: Navigation Link
        icon: link
        value:
          name: ""
          path: ""
        _inputs:
          name:
            type: text
            comment: "Display text for the navigation link."
          path:
            type: url
            comment: "URL path for the navigation link."
            options:
              hide_link_to_file: true
              hide_link_to_email_address: true
              hide_link_to_telephone: true
  socialItems:
    values:
      - label: Social Link
        icon: share
        value:
          icon: ""
          link: ""
        _inputs:
          icon:
            type: select
            comment: "Icon for the social media platform. Sourced from [Heroicons](https://heroicons.com/)."
            options:
              values: _select_data.icons
              preview:
                text:
                  - key: name
                image:
                  - template: src/icons/{id}.svg
          link:
            type: text
            comment: "URL link to the social media profile."
